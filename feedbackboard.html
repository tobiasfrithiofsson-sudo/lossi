<!DOCTYPE html>
<html lang="sv" class="auth-pending" data-auth-required>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback från testare | Lossi</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="buttons.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="feedbackboard.css" />
  <script src="https://unpkg.com/lucide@1.61.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="theme.js"></script>
  <script src="data.js"></script>
  <script src="schedule.js"></script>
  <script src="plan-markup.js"></script>
  <script src="ai-import.js"></script>
  <script src="feedback.js"></script>
</head>
<body>

<header class="app-topbar"></header>

<div class="app-body">
  <aside class="app-aside"></aside>

  <main class="fb-main">
    <div class="fb-header">
      <div>
        <h1 class="fb-title">Feedback från testare</h1>
        <p class="fb-lead">Allt som skickats via Feedback-knappen, nyast först. Status och anteckningar syns bara här.</p>
      </div>
      <button class="btn btn-outline" onclick="loadFeedback()" title="Hämta på nytt"><i data-lucide="refresh-cw"></i>Uppdatera</button>
    </div>

    <div class="fb-stats" id="fbStats"></div>

    <div class="fb-filters">
      <div class="fb-segment" role="tablist" aria-label="Typ">
        <button type="button" class="fb-seg is-active" data-kind="">Alla</button>
        <button type="button" class="fb-seg" data-kind="idea"><i data-lucide="lightbulb"></i>Idéer</button>
        <button type="button" class="fb-seg" data-kind="bug"><i data-lucide="bug"></i>Buggar</button>
        <button type="button" class="fb-seg" data-kind="other"><i data-lucide="message-circle"></i>Övrigt</button>
      </div>
      <select class="field-input fb-status-filter" id="fbStatusFilter" aria-label="Status">
        <option value="">Alla statusar</option>
        <option value="new">Nya</option>
        <option value="seen">Lästa</option>
        <option value="done">Åtgärdade</option>
        <option value="wontfix">Avfärdade</option>
      </select>
    </div>

    <div class="fb-list" id="fbList">
      <div class="fb-empty">Hämtar feedback…</div>
    </div>
  </main>
</div>

<script>
  // ── Feedback från testare (bara administratörer) ──
  // Läser all feedback via LossiData.listAllFeedback (supabase/feedback-admin.sql).
  // Status och anteckning ändras direkt här och är samma som Claude ser och sätter.
  LossiAuth.requireUser().then(applyUserProfile);
  renderAppShell({ active: '' });
  lucide.createIcons();
  syncThemeIcons();

  const KINDS = {
    idea:  { label: 'Idé', icon: 'lightbulb' },
    bug:   { label: 'Bugg', icon: 'bug' },
    other: { label: 'Övrigt', icon: 'message-circle' },
  };
  const STATUSES = {
    new:     'Ny',
    seen:    'Läst',
    done:    'Åtgärdad',
    wontfix: 'Avfärdad',
  };

  let items = [];
  let kindFilter = '';
  let statusFilter = '';

  function relativeTime(date) {
    const diff = (date - Date.now()) / 1000;
    const rtf = new Intl.RelativeTimeFormat('sv', { numeric: 'auto' });
    const steps = [['year', 31536000], ['month', 2592000], ['week', 604800], ['day', 86400], ['hour', 3600], ['minute', 60]];
    for (const [unit, sec] of steps) {
      if (Math.abs(diff) >= sec) return rtf.format(Math.round(diff / sec), unit);
    }
    return 'nyss';
  }

  function browserName(ua = '') {
    const m = /Edg\/(\d+)/.exec(ua) || null;
    if (m) return 'Edge ' + m[1];
    if (/Firefox\/(\d+)/.test(ua)) return 'Firefox ' + /Firefox\/(\d+)/.exec(ua)[1];
    if (/Chrome\/(\d+)/.test(ua)) return 'Chrome ' + /Chrome\/(\d+)/.exec(ua)[1];
    if (/Version\/(\d+).*Safari/.test(ua)) return 'Safari ' + /Version\/(\d+)/.exec(ua)[1];
    return 'Okänd webbläsare';
  }

  function systemName(ua = '') {
    if (/iPhone|iPad/.test(ua)) return 'iOS';
    if (/Android/.test(ua)) return 'Android';
    if (/Mac OS X/.test(ua)) return 'Mac';
    if (/Windows/.test(ua)) return 'Windows';
    return '';
  }

  function initials(name = '') {
    const parts = name.split(/[\s._@-]+/).filter(Boolean);
    return ((parts[0]?.[0] || '?') + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
  }

  // Samma person får alltid samma färg
  function personColor(name = '') {
    const colors = ['#7C4FE0', '#2F6FED', '#E2508F', '#0E8F86', '#E8650C', '#15803D', '#4F46E5', '#DB2777'];
    let h = 0;
    for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
    return colors[h % colors.length];
  }

  function pageLabel(page = '') {
    if (page.startsWith('/upplag')) return 'Upplägg';
    if (page.startsWith('/calendar')) return 'Kalender';
    if (page === '/' || page.startsWith('/index')) return 'Översikt';
    if (page.startsWith('/feedbackboard')) return 'Feedbacksidan';
    return page || 'Okänd sida';
  }

  function renderStats() {
    const count = s => items.filter(i => i.status === s).length;
    document.getElementById('fbStats').innerHTML = `
      <div class="fb-stat"><span class="fb-stat-num">${items.length}</span><span>totalt</span></div>
      <div class="fb-stat is-new"><span class="fb-stat-num">${count('new')}</span><span>nya</span></div>
      <div class="fb-stat"><span class="fb-stat-num">${count('seen')}</span><span>lästa</span></div>
      <div class="fb-stat is-done"><span class="fb-stat-num">${count('done')}</span><span>åtgärdade</span></div>`;
  }

  function renderList() {
    const list = document.getElementById('fbList');
    const shown = items.filter(i => (!kindFilter || i.kind === kindFilter) && (!statusFilter || i.status === statusFilter));
    if (!items.length) {
      list.innerHTML = '<div class="fb-empty"><i data-lucide="inbox"></i>Ingen feedback ännu. Den dyker upp här när testarna använder Feedback-knappen.</div>';
    } else if (!shown.length) {
      list.innerHTML = '<div class="fb-empty">Ingen feedback matchar filtret.</div>';
    } else {
      list.innerHTML = shown.map(i => {
        const kind = KINDS[i.kind] || KINDS.other;
        const ctx = i.context || {};
        const when = new Date(i.created_at);
        const sys = systemName(ctx.userAgent);
        return `
        <article class="fb-card status-${i.status}" data-id="${i.id}">
          <div class="fb-card-head">
            <div class="fb-avatar" style="background:${personColor(i.author)}">${escapeHTML(initials(i.author))}</div>
            <div class="fb-who">
              <span class="fb-author">${escapeHTML(i.author || 'Okänd')}</span>
              <span class="fb-when" title="${when.toLocaleString('sv-SE')}">${relativeTime(when)}</span>
            </div>
            <span class="fb-kind kind-${i.kind}"><i data-lucide="${kind.icon}"></i>${kind.label}</span>
            <select class="field-input fb-status" aria-label="Status" data-id="${i.id}">
              ${Object.entries(STATUSES).map(([k, v]) => `<option value="${k}"${k === i.status ? ' selected' : ''}>${v}</option>`).join('')}
            </select>
          </div>
          <p class="fb-message">${escapeHTML(i.message)}</p>
          <div class="fb-meta">
            <a href="${escapeHTML(i.page || '#')}" class="fb-meta-item fb-page"><i data-lucide="file-text"></i>${escapeHTML(ctx.planTitle ? pageLabel(i.page) + ': ' + ctx.planTitle : pageLabel(i.page))}</a>
            <span class="fb-meta-item"><i data-lucide="monitor"></i>${escapeHTML([browserName(ctx.userAgent), sys].filter(Boolean).join(' på '))}</span>
            ${ctx.viewport ? `<span class="fb-meta-item"><i data-lucide="maximize-2"></i>${escapeHTML(ctx.viewport)}</span>` : ''}
            ${ctx.theme ? `<span class="fb-meta-item"><i data-lucide="${ctx.theme === 'dark' ? 'moon' : 'sun'}"></i>${ctx.theme === 'dark' ? 'Mörkt läge' : 'Ljust läge'}</span>` : ''}
          </div>
          <div class="fb-note">
            <textarea class="field-input fb-note-input" rows="1" data-id="${i.id}" placeholder="Anteckning, t.ex. vad som gjorts…">${escapeHTML(i.note || '')}</textarea>
            <span class="fb-note-saved" aria-live="polite"></span>
          </div>
        </article>`;
      }).join('');
    }
    lucide.createIcons({ nodes: [list] });
    list.querySelectorAll('.fb-note-input').forEach(autoGrow);
  }

  function autoGrow(textarea) {
    textarea.style.height = 'auto';
    textarea.style.height = textarea.scrollHeight + 2 + 'px';
  }

  async function save(id, saveEl) {
    const item = items.find(i => String(i.id) === String(id));
    if (!item) return;
    try {
      await LossiData.updateFeedback(item.id, item.status, item.note);
      if (saveEl) {
        saveEl.textContent = 'Sparat';
        setTimeout(() => { saveEl.textContent = ''; }, 1800);
      }
      renderStats();
    } catch (e) {
      console.warn('Kunde inte spara feedback:', e);
      alert('Kunde inte spara ändringen. Försök igen om en stund.');
    }
  }

  async function loadFeedback() {
    const list = document.getElementById('fbList');
    try {
      items = await LossiData.listAllFeedback();
    } catch (e) {
      console.warn('Kunde inte hämta feedback:', e);
      items = [];
      list.innerHTML = `<div class="fb-empty"><i data-lucide="lock"></i>${
        e?.code === 'PGRST202'
          ? 'Feedbacksidan är inte aktiverad i databasen än. Kör supabase/feedback-admin.sql i Supabase.'
          : e?.code === '42501' || /not allowed/i.test(e?.message || '')
            ? 'Den här sidan är bara för administratörer. Har du precis fått rollen? Logga ut och in igen.'
            : 'Kunde inte hämta feedback. Ladda om sidan för att försöka igen.'
      }</div>`;
      lucide.createIcons({ nodes: [list] });
      document.getElementById('fbStats').innerHTML = '';
      return;
    }
    renderStats();
    renderList();
  }

  document.querySelector('.fb-segment').addEventListener('click', e => {
    const btn = e.target.closest('.fb-seg');
    if (!btn) return;
    kindFilter = btn.dataset.kind;
    document.querySelectorAll('.fb-seg').forEach(b => b.classList.toggle('is-active', b === btn));
    renderList();
  });

  document.getElementById('fbStatusFilter').addEventListener('change', e => {
    statusFilter = e.target.value;
    renderList();
  });

  document.getElementById('fbList').addEventListener('change', e => {
    if (!e.target.classList.contains('fb-status')) return;
    const item = items.find(i => String(i.id) === e.target.dataset.id);
    item.status = e.target.value;
    e.target.closest('.fb-card').className = 'fb-card status-' + item.status;
    save(item.id, e.target.closest('.fb-card').querySelector('.fb-note-saved'));
  });

  document.getElementById('fbList').addEventListener('input', e => {
    if (e.target.classList.contains('fb-note-input')) autoGrow(e.target);
  });

  document.getElementById('fbList').addEventListener('focusout', e => {
    if (!e.target.classList.contains('fb-note-input')) return;
    const item = items.find(i => String(i.id) === e.target.dataset.id);
    const note = e.target.value.trim();
    if (!item || (item.note || '') === note) return;
    item.note = note;
    save(item.id, e.target.parentElement.querySelector('.fb-note-saved'));
  });

  loadFeedback();
</script>
</body>
</html>
