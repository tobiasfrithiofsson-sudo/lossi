<!DOCTYPE html>
<html lang="sv" class="auth-pending" data-auth-required>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lossi – Pedagogiska upplägg för lärare</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="buttons.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="mascot.css" />
  <script src="https://unpkg.com/lucide@1.61.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="theme.js"></script>
  <script src="data.js"></script>
  <script src="schedule.js"></script>
  <script src="plan-markup.js"></script>
  <script src="ai-import.js"></script>
  <script src="starter-plans.js"></script>
  <script src="feedback.js"></script>
</head>
<body>

<!-- ── App topbar (byggs av renderAppShell i theme.js) ── -->
<header class="app-topbar"></header>

<div class="app-body">

<!-- ── Sidopanel: projekt, händelser, upplägg, team (byggs av renderAppShell i theme.js) ── -->
<aside class="app-aside"></aside>

<!-- ── Main ── -->
<main>

  <!-- Kommande: de närmaste inlagda lektionerna i valt projekt (renderUpcoming) -->
  <div class="upcoming-panel" id="upcomingPanel" hidden>
    <div class="upcoming-panel-label">Kommande</div>
    <div class="upcoming-list" id="upcomingList"></div>
  </div>

  <!-- Upplägg: alla upplägg i valt projekt (allas, eller bara mina), samlade för överblick -->
  <div class="plan-section" id="sec-plans">
    <div class="section-head">
      <h2><button type="button" class="section-toggle" aria-expanded="true" aria-controls="sec-plans" onclick="toggleSection('sec-plans')">Upplägg<i data-lucide="chevron-down" class="section-chevron"></i></button></h2>
    </div>
    <div class="section-body">

      <div class="filter-bar">
        <!-- Alla i projektet / bara mina (döljs i det egna projektet, där allt är ens eget) -->
        <div class="filter-toggle" id="ownerFilter" role="group" aria-label="Visa upplägg" hidden>
          <button type="button" data-owner="all" aria-pressed="true" onclick="setOwnerFilter('all')">Alla</button>
          <button type="button" data-owner="mine" aria-pressed="false" onclick="setOwnerFilter('mine')">Bara mina</button>
        </div>
        <div class="btn btn-subtle filter-select">
          <i data-lucide="book-open"></i>
          <select id="filterSubject" onchange="filterPlans()">
            <option value="">Alla ämnen</option>
            <option value="Samhällskunskap">Samhällskunskap</option>
            <option value="Biologi">Biologi</option>
          </select>
          <i data-lucide="chevron-down" class="filter-select-chevron"></i>
        </div>
        <div class="btn btn-subtle filter-select">
          <i data-lucide="users"></i>
          <select id="filterGrade" onchange="filterPlans()">
            <option value="">Alla årskurser</option>
            <option value="Åk 7">Åk 7</option>
            <option value="Åk 9">Åk 9</option>
            <option value="Åk 7–9">Åk 7–9</option>
          </select>
          <i data-lucide="chevron-down" class="filter-select-chevron"></i>
        </div>
      </div>

      <div class="plan-list" id="planList">
        <!-- Raderna byggs av renderPlanList() från uppläggsregistret i theme.js -->

        <div class="plan-list-empty" id="planListEmpty">Inga upplägg matchar filtret.</div>

      </div>
    </div>
  </div>
</main>

</div><!-- /app-body -->

<script>
  LossiAuth.requireUser().then(applyUserProfile);
  renderAppShell({ active: 'plans', onProjectChange: () => { loadPlanList(); renderUpcoming(); } });
  lucide.createIcons();
  syncThemeIcons();

  // ── Upplägg-listan: alla upplägg i valt projekt, senast skapade först ──
  // Varje rad visar skaparens avatar. Andras upplägg öppnas i läsläge.
  let ownerFilter = 'all';
  try { ownerFilter = localStorage.getItem('lossi-owner-filter') === 'mine' ? 'mine' : 'all'; } catch (e) {}
  let me = null;
  let projectMembers = [];
  let editRequests = new Map(); // planId → antal kollegor som vill redigera

  function setOwnerFilter(value) {
    ownerFilter = value;
    try { localStorage.setItem('lossi-owner-filter', value); } catch (e) {}
    document.querySelectorAll('#ownerFilter button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.owner === value)));
    filterPlans();
  }

  // Profil (namn, avatar) för skaparen av ett upplägg
  function ownerProfile(ownerId) {
    if (me && ownerId === me.id) return LossiAuth.profileOf(me);
    const m = projectMembers.find(x => x.userId === ownerId);
    return m ? { displayName: m.displayName, avatar: m.avatar, email: m.email } : { displayName: '', avatar: null, email: '' };
  }

  async function loadPlanList() {
    const empty = document.getElementById('planListEmpty');
    try {
      const [user, project] = await Promise.all([LossiAuth.getUser(), LossiData.currentProject()]);
      me = user;
      projectMembers = project?.members || [];
      // Är man ensam i projektet är allt ens eget: inget Alla/Bara mina
      const shared = !!project && project.members.length > 1;
      document.getElementById('ownerFilter').hidden = !shared;
      setOwnerFilter(shared ? ownerFilter : 'all');
      const [plans, requests] = await Promise.all([LossiData.listPlans({ projectId: project?.id }), editRequestCounts()]);
      editRequests = requests;
      empty.textContent = 'Inga upplägg matchar filtret.';
      renderPlanList(plans.slice().reverse().map(p => getPlanSummary(p.id, p.state, p.ownerId)));
    } catch (e) {
      console.warn('Kunde inte hämta upplägg:', e);
      document.querySelectorAll('#planList .plan-row').forEach(r => r.remove());
      empty.textContent = 'Kunde inte hämta upplägg. Ladda om sidan för att försöka igen.';
      empty.style.display = 'flex';
    }
  }

  function renderPlanList(plans) {
    const list = document.getElementById('planList');
    list.querySelectorAll('.plan-row').forEach(r => r.remove());
    const rows = plans.map(p => {
      const gradeDisplay = gradeLabel(p.grade);
      const meta = [p.subject, gradeDisplay].filter(Boolean).join(' · ');
      const mine = me && p.ownerId === me.id;
      const owner = ownerProfile(p.ownerId);
      const ownerName = mine ? 'Du' : (profileName(owner) || 'Okänd');
      return `
        <div class="plan-row" data-plan-id="${p.id}" data-mine="${mine}" data-subject="${escapeHTML(p.subject)}" data-grade="${escapeHTML(gradeDisplay)}" onclick="window.location='upplag.html?id=${p.id}'">
          <div class="plan-row-icon plan-icon-image">${planAvatarImgHTML(p.avatar)}</div>
          <span class="plan-row-title">${escapeHTML(p.title)}</span>
          ${mine && editRequests.get(p.id) ? `<span class="plan-row-request">${editRequests.get(p.id) === 1 ? '1 vill redigera' : editRequests.get(p.id) + ' vill redigera'}</span>` : ''}
          <span class="plan-row-meta">${escapeHTML(meta)}</span>
          <div class="plan-row-avatar" title="Skapat av ${escapeHTML(ownerName)}">${userAvatarHTML(owner)}</div>
        </div>`;
    }).join('');
    document.getElementById('planListEmpty').insertAdjacentHTML('beforebegin', rows);
    lucide.createIcons({ nodes: [list] });
    rebuildFilterOptions();
    filterPlans();
  }

  // Kommande: de närmaste inlagda lektionerna (kalendern, schedule.js). Utan
  // inlagda lektioner visas en hänvisning till kalendern.
  async function renderUpcoming() {
    const panel = document.getElementById('upcomingPanel');
    const list = document.getElementById('upcomingList');
    let upcoming;
    try {
      upcoming = await upcomingInCurrentProject(3);
    } catch (e) {
      console.warn('Kunde inte hämta kommande lektioner:', e);
      return; // t.ex. om kalendertabellen inte finns än: visa ingenting
    }
    list.innerHTML = upcoming.length
      ? upcoming.map(e => `
        <a class="upcoming-card" href="upplag.html?id=${e.planId}" data-plan-id="${e.planId}">
          <div class="upcoming-card-icon plan-icon-image">${planAvatarImgHTML(e.plan.avatar)}</div>
          <div class="upcoming-card-title">${escapeHTML(e.lessonName)}</div>
          <div class="upcoming-card-plan">${escapeHTML(e.plan.title)}</div>
          <div class="upcoming-card-step"><i data-lucide="calendar-days"></i>${escapeHTML(formatEventWhen(e))}</div>
        </a>`).join('')
      : `<div class="upcoming-empty">
          <i data-lucide="calendar-plus"></i>
          <span>Inga lektioner inlagda än. Lägg in dem från ett upplägg eller i <a href="calendar.html">kalendern</a>.</span>
        </div>`;
    lucide.createIcons({ nodes: [list] });
    panel.hidden = false;
  }

  // Filtren ska alltid spegla de ämnen/årskurser som faktiskt finns, inte en hårdkodad lista
  function rebuildFilterOptions() {
    const rows = Array.from(document.querySelectorAll('.plan-row'));
    const subjects = [...new Set(rows.map(r => r.dataset.subject).filter(Boolean))];
    const grades = [...new Set(rows.map(r => r.dataset.grade).filter(Boolean))];

    const subjectSelect = document.getElementById('filterSubject');
    const currentSubject = subjectSelect.value;
    subjectSelect.innerHTML = '<option value="">Alla ämnen</option>' +
      subjects.map(s => `<option value="${s}">${s}</option>`).join('');
    subjectSelect.value = subjects.includes(currentSubject) ? currentSubject : '';

    const gradeSelect = document.getElementById('filterGrade');
    const currentGrade = gradeSelect.value;
    gradeSelect.innerHTML = '<option value="">Alla årskurser</option>' +
      grades.map(g => `<option value="${g}">${g}</option>`).join('');
    gradeSelect.value = grades.includes(currentGrade) ? currentGrade : '';
  }

  loadPlanList();
  // Kommande gäller lärarens egen kalender, i alla projekt
  // Kommande gäller valt projekt (lärarens egna inlagda lektioner i det)
  renderUpcoming();

  function toggleSection(id) {
    const section = document.getElementById(id);
    const collapsed = section.classList.toggle('collapsed');
    section.querySelector('.section-toggle')?.setAttribute('aria-expanded', String(!collapsed));
  }

  function filterPlans() {
    const subject = document.getElementById('filterSubject').value;
    const grade = document.getElementById('filterGrade').value;
    const rows = document.querySelectorAll('.plan-row');
    let visibleCount = 0;
    rows.forEach(row => {
      const matchesSubject = !subject || row.dataset.subject === subject;
      const matchesGrade = !grade || row.dataset.grade === grade;
      const matchesOwner = ownerFilter === 'all' || row.dataset.mine === 'true';
      const visible = matchesSubject && matchesGrade && matchesOwner;
      row.style.display = visible ? '' : 'none';
      if (visible) visibleCount++;
    });
    document.getElementById('planListEmpty').style.display = visibleCount === 0 ? 'flex' : 'none';
  }
</script>
<!-- Välkommen efter Skapa konto och rundturen (Visa rundturen i användarmenyn) -->
<script src="mascot.js"></script>
<script src="tour.js"></script>
</body>
</html>
